name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Build
        run: cargo build --release --locked

      - name: Unit tests
        run: cargo test --release --locked

      - name: Off-screen UI picture and ENI export
        shell: bash
        run: |
          bin=target/release/ecat-configurator
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" --screenshot ui.png
          "$bin" --export-eni eni.xml --export-header process_image.h
          "$bin" --eni eni.xml --export-eni eni_again.xml
          cmp eni.xml eni_again.xml

      - name: Debian package
        if: runner.os == 'Linux'
        run: packaging/build-deb.sh

      - name: macOS app bundle
        if: runner.os == 'macOS'
        run: packaging/build-macos-app.sh

      - name: Windows zip
        if: runner.os == 'Windows'
        shell: bash
        run: packaging/build-windows-zip.sh

      - name: Upload program
        uses: actions/upload-artifact@v4
        with:
          name: ecat-configurator-${{ runner.os }}
          path: |
            target/release/ecat-configurator
            target/release/ecat-configurator.exe
            ui.png
            eni.xml
          if-no-files-found: warn

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ runner.os }}
          path: |
            dist/*.deb
            dist/*.zip
          if-no-files-found: warn
